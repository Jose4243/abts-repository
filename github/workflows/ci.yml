name: CI Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Validate Static Assets & HTML Structure
        run: |
          echo "Running automated build and validation checks for Kensington Library Suite..."
          find . -name "*.html" -maxdepth 3
          echo "Static verification passed successfully."
