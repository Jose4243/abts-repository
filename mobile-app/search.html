<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kensington Mobile Library - Search Catalog</title>
  <link rel="stylesheet" href="../css/mobile.css">
  
  <script>
    if (localStorage.getItem('abts_authenticated') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <header class="greeting-banner">
    <h2>Live Library API Catalog 🔍</h2>
    <p>Tap any book to check availability & borrow</p>
  </header>

  <main class="mobile-content">
    <section class="search-section">
      <div class="quick-search">
        <input type="text" id="catalogInput" placeholder="Search live books (e.g. Orwell, Harry Potter)..." onkeypress="handleSearchKey(event)" aria-label="Search library catalog">
      </div>
      <button onclick="fetchLibraryAPI()" class="btn" style="width:100%; margin-top:8px; padding:10px; background:#065a82; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Query Live API</button>
    </section>

    <section class="section-block">
      <h3>API Search Results</h3>
      <p class="author" id="api-status" style="margin-top: 6px;">Type a book title above and click Query to fetch live records via REST API.</p>
      <div id="resultsContainer" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
    </section>
  </main>

  <!-- Book Availability & Borrow Modal -->
  <div id="bookModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div id="bookModalCard" style="background:#fff; color:#1e293b; width:100%; max-width:380px; border-radius:12px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.3);">
      <h3 id="modalTitle" style="margin-bottom:6px;">Book Title</h3>
      <p id="modalAuthor" style="color:#64748b; font-size:0.9rem; margin-bottom:12px;">Author</p>
      <p style="margin-bottom:16px;"><strong>Availability:</strong> <span id="modalStatusBadge"></span></p>
      
      <div style="display:flex; gap:10px;">
        <button id="modalBorrowBtn" onclick="confirmBorrow()" style="flex:1; padding:10px; background:#27ae60; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Borrow Book</button>
        <button onclick="closeBookModal()" style="padding:10px 14px; background:#e2e8f0; color:#1e293b; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="search.html" class="nav-item active">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">Search</span>
    </a>
    <a href="digital-id.html" class="nav-item">
      <span class="nav-icon">🪪</span>
      <span class="nav-label">Digital ID</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <script>
    let selectedBook = null;

    // Seed default borrowed books if none exist yet
    function getBorrowedBooks() {
      const stored = localStorage.getItem('abts_borrowed_books');
      if (stored) return JSON.parse(stored);
      const defaults = [
        { title: "1984", author: "George Orwell", year: "1949", dueDate: "Nov 29, 2026", borrowedBy: localStorage.getItem('abts_user_name') || "Josecontreiras" },
        { title: "To Kill a Mockingbird", author: "Harper Lee", year: "1960", dueDate: "Dec 5, 2026", borrowedBy: localStorage.getItem('abts_user_name') || "Josecontreiras" }
      ];
      localStorage.setItem('abts_borrowed_books', JSON.stringify(defaults));
      return defaults;
    }

    function isBookBorrowed(title) {
      return getBorrowedBooks().some(b => b.title.toLowerCase() === title.toLowerCase());
    }

    async function fetchLibraryAPI() {
      const query = document.getElementById('catalogInput').value.trim();
      const container = document.getElementById('resultsContainer');
      const status = document.getElementById('api-status');
      const isDark = localStorage.getItem('abts_theme') === 'dark';

      if (!query) {
        alert("Please enter a search term for the live API query.");
        return;
      }

      status.textContent = `Searching Open Library API for "${query}"...`;
      container.innerHTML = "";

      try {
        const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=6`, {
          cache: 'no-store'
        });
        const data = await response.json();

        if (data.docs && data.docs.length > 0) {
          status.textContent = `Tap a book below to view availability (${data.docs.length} found):`;
          
          data.docs.forEach(book => {
            const title = book.title || "Unknown Title";
            const author = book.author_name ? book.author_name.join(', ') : "Unknown Author";
            const year = book.first_publish_year || "N/A";
            const borrowed = isBookBorrowed(title);

            const card = document.createElement('article');
            card.className = "carousel-card";
            card.style.cssText = `
              min-width: 100%; 
              padding: 14px; 
              cursor: pointer;
              background: ${isDark ? '#1e293b' : '#ffffff'}; 
              color: ${isDark ? '#f8fafc' : '#1e293b'};
              border: 1px solid ${isDark ? '#334155' : '#cbd5e1'}; 
              border-radius: 8px;
            `;
            card.innerHTML = `
              <h4 style="color: ${isDark ? '#38bdf8' : '#1b3a4b'}; font-size: 1rem;">${title}</h4>
              <p class="author" style="color: ${isDark ? '#94a3b8' : '#64748b'}; font-size: 0.85rem;">Author: ${author} • First Published: ${year}</p>
              <p class="due-info" style="color: ${borrowed ? '#e67e22' : '#27ae60'}; font-weight: bold; font-size: 0.82rem; margin-top: 6px;">
                ${borrowed ? '● Currently Borrowed (Tap for details)' : '● Available to Borrow (Tap to borrow)'}
              </p>
            `;
            card.onclick = () => openBookModal({ title, author, year });
            container.appendChild(card);
          });
        } else {
          status.textContent = `No books found matching "${query}".`;
        }
      } catch (error) {
        console.error("API Fetch Error:", error);
        status.textContent = "Error connecting to Open Library API. Check network connection.";
      }
    }

    function openBookModal(book) {
      selectedBook = book;
      const borrowed = isBookBorrowed(book.title);
      const isDark = localStorage.getItem('abts_theme') === 'dark';

      const modalCard = document.getElementById('bookModalCard');
      modalCard.style.backgroundColor = isDark ? '#1e293b' : '#ffffff';
      modalCard.style.color = isDark ? '#f8fafc' : '#1e293b';

      document.getElementById('modalTitle').textContent = book.title;
      document.getElementById('modalAuthor').textContent = `By ${book.author} (${book.year})`;

      const badge = document.getElementById('modalStatusBadge');
      const borrowBtn = document.getElementById('modalBorrowBtn');

      if (borrowed) {
        badge.textContent = "Borrowed / Checked Out";
        badge.style.color = "#e67e22";
        badge.style.fontWeight = "bold";
        borrowBtn.disabled = true;
        borrowBtn.textContent = "Already Borrowed";
        borrowBtn.style.background = "#94a3b8";
        borrowBtn.style.cursor = "not-allowed";
      } else {
        badge.textContent = "Available";
        badge.style.color = "#27ae60";
        badge.style.fontWeight = "bold";
        borrowBtn.disabled = false;
        borrowBtn.textContent = "Borrow Book";
        borrowBtn.style.background = "#27ae60";
        borrowBtn.style.cursor = "pointer";
      }

      document.getElementById('bookModal').style.display = 'flex';
    }

    function closeBookModal() {
      document.getElementById('bookModal').style.display = 'none';
      selectedBook = null;
    }

    function confirmBorrow() {
      if (!selectedBook) return;
      const books = getBorrowedBooks();
      const memberName = localStorage.getItem('abts_user_name') || 'Josecontreiras';

      // Set due date 14 days from today
      const due = new Date();
      due.setDate(due.getDate() + 14);
      const formattedDue = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      books.unshift({
        title: selectedBook.title,
        author: selectedBook.author,
        year: selectedBook.year,
        dueDate: formattedDue,
        borrowedBy: memberName
      });

      localStorage.setItem('abts_borrowed_books', JSON.stringify(books));
      console.log(`Book borrowed by ${memberName}:`, selectedBook.title);

      closeBookModal();
      alert(`"${selectedBook.title}" has been borrowed! It now appears on your Home screen and the Admin Web Dashboard.`);
      fetchLibraryAPI(); // Refresh list badges immediately
    }

    function handleSearchKey(e) {
      if (e.key === 'Enter') fetchLibraryAPI();
    }

    document.addEventListener("DOMContentLoaded", () => {
      getBorrowedBooks(); // Ensure default state is initialized
      if (localStorage.getItem('abts_theme') === 'dark') {
        document.body.style.backgroundColor = "#0f172a";
        document.body.style.color = "#f8fafc";
        const header = document.querySelector('.greeting-banner');
        if (header) header.style.backgroundColor = "#1e293b";
        const input = document.getElementById('catalogInput');
        if (input) {
          input.style.backgroundColor = "#1e293b";
          input.style.color = "#f8fafc";
          input.style.borderColor = "#334155";
        }
        const nav = document.querySelector('.bottom-nav');
        if (nav) {
          nav.style.backgroundColor = "#1e293b";
          nav.style.borderColor = "#334155";
        }
      }
    });
  </script>
</body>
</html>
