<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kensington Mobile Library - Home</title>
  <link rel="stylesheet" href="../css/mobile.css">
  
  <script>
    if (localStorage.getItem('abts_authenticated') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <header class="greeting-banner">
    <h2 id="user-greeting">Hello, User 👋</h2>
    <p id="user-id-display">Member ID: M-1001 | Kensington Branch</p>
  </header>

  <main class="mobile-content">
    <section class="search-section">
      <div class="quick-search">
        <input type="text" id="catalog-search" placeholder="🔍 Quick search catalog by title, author, or ISBN..." aria-label="Search catalog">
      </div>
    </section>

    <section class="section-block">
      <h3>Active Borrowed Books</h3>
      <div class="carousel-container">
        <article class="carousel-card">
          <h4>1984</h4>
          <p class="author">George Orwell</p>
          <p class="due-info">Due in 2 Days (Sep 5, 2026)</p>
          <div class="progress-bar-container">
            <div class="progress-bar warning" style="width: 85%;"></div>
          </div>
        </article>

        <article class="carousel-card">
          <h4>To Kill a Mockingbird</h4>
          <p class="author">Harper Lee</p>
          <p class="due-info">Due in 10 Days (Sep 13, 2026)</p>
          <div class="progress-bar-container">
            <div class="progress-bar safe" style="width: 30%;"></div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="search.html" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">Search</span>
    </a>
    <a href="digital-id.html" class="nav-item">
      <span class="nav-icon">🪪</span>
      <span class="nav-label">Digital ID</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const listContainer = document.getElementById('mobile-borrowed-list');
    if (!listContainer) return;

    const isDark = localStorage.getItem('abts_theme') === 'dark';
    const stored = localStorage.getItem('abts_borrowed_books');
    const books = stored ? JSON.parse(stored) : [
      { title: "1984", author: "George Orwell", dueDate: "Nov 29, 2026" },
      { title: "To Kill a Mockingbird", author: "Harper Lee", dueDate: "Dec 5, 2026" }
    ];

    listContainer.innerHTML = books.map(book => `
      <article class="carousel-card" style="padding: 14px; border-radius: 8px; border: 1px solid ${isDark ? '#334155' : '#cbd5e1'}; background: ${isDark ? '#1e293b' : '#ffffff'}; margin-bottom: 10px;">
        <h4 style="color: ${isDark ? '#38bdf8' : '#1b3a4b'};">${book.title}</h4>
        <p class="author" style="color: ${isDark ? '#94a3b8' : '#64748b'}; font-size: 0.85rem;">${book.author}</p>
        <p class="due-info" style="color: #e67e22; font-size: 0.82rem; font-weight: bold; margin-top: 4px;">Status: Borrowed • Due ${book.dueDate}</p>
      </article>
    `).join('');
  });
</script>
</body>
</html>
