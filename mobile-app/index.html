<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kensington Mobile Library - Home</title>
  <link rel="stylesheet" href="../css/mobile.css">
  <script>
    // Auth Guard
    if (localStorage.getItem('abts_authenticated') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <!-- Greeting Banner -->
  <header class="greeting-banner">
    <h2 id="user-greeting">Hello, User 👋</h2>
    <p id="user-id-display">Member ID: M-1001 | Kensington Branch</p>
  </header>

  <main class="mobile-content">
    <!-- Quick Search Bar -->
    <section class="search-section">
      <div class="quick-search">
        <input type="text" placeholder="🔍 Quick search catalog by title, author, or ISBN..." aria-label="Search catalog">
      </div>
    </section>

    <!-- Active Borrowed Books Carousel -->
    <section class="section-block">
      <h3>Active Borrowed Books</h3>
      <div class="carousel-container">
        <!-- Card 1 -->
        <article class="carousel-card">
          <h4>1984</h4>
          <p class="author">George Orwell</p>
          <p class="due-info">Due in 2 Days (Sep 5, 2026)</p>
          <div class="progress-bar-container">
            <div class="progress-bar warning" style="width: 85%;"></div>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="carousel-card">
          <h4>To Kill a Mockingbird</h4>
          <p class="author">Harper Lee</p>
          <p class="due-info">Due in 10 Days (Sep 13, 2026)</p>
          <div class="progress-bar-container">
            <div class="progress-bar safe" style="width: 30%;"></div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <!-- Persistent 4-Item Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="#search" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">Search</span>
    </a>
    <a href="digital-id.html" class="nav-item">
      <span class="nav-icon">🪪</span>
      <span class="nav-label">Digital ID</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const name = localStorage.getItem('abts_user_name') || 'Jane Doe';
      const email = localStorage.getItem('abts_user_email') || 'jane.doe@kensington.org';
      
      document.getElementById('user-greeting').textContent = `Hello, ${name} 👋`;
      document.getElementById('user-id-display').textContent = `Account: ${email} | Kensington Branch`;
    });
  </script>
</body>
</html>
