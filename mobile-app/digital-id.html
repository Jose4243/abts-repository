<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kensington Mobile Library - Digital ID</title>
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
  <main class="mobile-content center-wrapper">
    <!-- Centered Card Presentation for Handheld Scanning -->
    <section class="digital-id-card">
      <header class="id-header">
        <h3>KENSINGTON COMMUNITY LIBRARY</h3>
        <span class="pass-badge">OFFICIAL MEMBER PASS</span>
      </header>

      <div class="id-body">
        <!-- Photo Placeholder -->
        <div class="photo-placeholder">
          <span class="photo-icon">👤</span>
          <span class="photo-text">PHOTO</span>
        </div>

        <!-- Member Details -->
        <div class="member-details">
          <h2>Jane Doe</h2>
          <p class="id-number"><strong>ID:</strong> M-1001-2026</p>
          <p class="member-status">STATUS: ACTIVE</p>
        </div>
      </div>

      <!-- Dynamically Generated QR Barcode Block -->
      <footer class="qr-container">
        <div class="mock-qr-code">
          <div class="qr-grid"></div>
          <p class="qr-label">||||| | |||| ||| ||||| |||</p>
          <span class="scan-hint">Scan at Desk Barcode Reader</span>
        </div>
      </footer>
    </section>
  </main>

  <!-- Persistent 4-Item Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="#search" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">Search</span>
    </a>
    <a href="digital-id.html" class="nav-item active">
      <span class="nav-icon">🪪</span>
      <span class="nav-label">Digital ID</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </a>
  </nav>
</body>
</html>
