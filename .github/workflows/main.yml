name: CI Build & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Validate HTML & Static Assets
      run: |
        echo "Running automated validation checks for Kensington Library Suite..."
        find . -name "*.html" -maxdepth 3
        echo "Static verification passed successfully."
