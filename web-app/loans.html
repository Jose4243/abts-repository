<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABTS - Issue Book Loan</title>
  <link rel="stylesheet" href="../css/desktop.css">
</head>
<body>
  <header class="app-header">
    <h1>Oakridge Library ABTS</h1>
    <div class="user-profile">
      <span>Staff ID: ST-1002</span>
    </div>
  </header>

  <div class="layout-container">
    <nav class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="loans.html" class="active">Loan Desk</a></li>
        <li><a href="reports.html">Reports & Fines</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <h2>Circulation Desk: Issue New Loan</h2>
      <form class="loan-form" action="#" method="POST">
        <div class="form-group">
          <label for="member-id">Member ID / Email</label>
          <input type="text" id="member-id" name="member-id" placeholder="Enter Member ID (e.g. M-1001)" required>
        </div>

        <div class="form-group">
          <label for="isbn">Book ISBN Number</label>
          <input type="text" id="isbn" name="isbn" placeholder="Scan or type 13-digit ISBN" required>
        </div>

        <div class="form-group">
          <label for="issue-date">Date Borrowed</label>
          <input type="date" id="issue-date" name="issue-date" value="2026-09-03" readonly>
        </div>

        <div class="form-group">
          <label for="due-date">Calculated Due Date (14 Days)</label>
          <input type="date" id="due-date" name="due-date" value="2026-09-17" readonly>
        </div>

        <button type="submit" class="submit-btn">Issue Loan Record</button>
      </form>
    </main>
  </div>
</body>
</html>
